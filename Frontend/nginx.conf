server {
    listen 80;
    server_name localhost;
    # Preusmjeri sav HTTP promet na HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name localhost;

    # Putanje do certifikata unutar containera (koje ćemo mountati)
    ssl_certificate /etc/nginx/certs/entriox.crt;
    ssl_certificate_key /etc/nginx/certs/entriox.key;

    root /usr/share/nginx/html;
    index index.html;

    # Serviranje React aplikacije
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy za Backend API (sve što počinje sa /api ide na backend container)
    location /api/ {
        proxy_pass http://entriox-api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}