version: "3.9"

services:
  # 1. BAZA
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: entriox-sql
    restart: always
    environment:
      SA_PASSWORD: "YourStrong_Password123"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - entriox_data:/var/opt/mssql
    networks:
      - entriox-net

  # 2. BACKEND API
  api:
    build:
      context: .
      dockerfile: ./EntrioX/Dockerfile
    container_name: entriox-api
    restart: always
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:8080"
      MSSQL_MEMORY_LIMIT_MB: "2048"
      # Connection string koristi ime servisa 'sqlserver'
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=EntrioX;User Id=sa;Password=YourStrong_Password123;TrustServerCertificate=True"
      # Ovdje stavi svoj pravi JWT secret
      SA_PASSWORD: "YourStrong_Password123"
    depends_on:
      - sqlserver
    volumes:
      # Map the script from your actual subfolder to the internal container path
      - ./EntrioX/entrypoint.sh:/app/entrypoint.sh
    # Tell the container to execute it from the internal path
    entrypoint: /app/entrypoint.sh
    networks:
      - entriox-net
    # Backend ne expose-amo vani, pristup ide samo kroz Nginx!

    # 3. FRONTEND & PROXY (NGINX)
  web:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=https://172.31.7.103/api
    container_name: entriox-web
    restart: always
    ports:
      - "80:80" # HTTP
      - "443:443" # HTTPS
    volumes:
      # Mountamo certifikate sa hosta u container
      - ./certs:/etc/nginx/certs
    depends_on:
      - api
    networks:
      - entriox-net

networks:
  entriox-net:


volumes:
  entriox_data:
